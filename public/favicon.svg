<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="katalyst-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8795A" />
      <stop offset="100%" stop-color="#D49A6A" />
    </linearGradient>
    <linearGradient id="katalyst-inner-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4E6EB" />
      <stop offset="100%" stop-color="#D49A6A" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Lattice Outer Boundary -->
  <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" stroke="url(#katalyst-primary-grad)" stroke-width="8" stroke-linejoin="round" fill="#1A1C20" />

  <!-- Inner Catalytic Orbital Ring -->
  <circle cx="50" cy="50" r="24" stroke="url(#katalyst-primary-grad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />

  <!-- Core Catalytic Spark Triangle -->
  <path d="M50 28 L68 64 L32 64 Z" fill="url(#katalyst-primary-grad)" />

  <!-- Center Nucleus Point -->
  <circle cx="50" cy="52" r="6" fill="url(#katalyst-inner-grad)" />

  <!-- Reaction Sparks -->
  <circle cx="50" cy="18" r="4" fill="#D49A6A" />
  <circle cx="78" cy="35" r="4" fill="#C8795A" />
  <circle cx="78" cy="65" r="4" fill="#D49A6A" />
  <circle cx="22" cy="35" r="4" fill="#C8795A" />
  <circle cx="22" cy="65" r="4" fill="#D49A6A" />
  <circle cx="50" cy="82" r="4" fill="#C8795A" />
</svg>
